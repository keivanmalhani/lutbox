<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>lutbox - preview .cube LUTs in the browser</title>
    <meta
      name="description"
      content="Apply a .cube LUT to your own image at full resolution in the browser, with a real 3D texture and trilinear interpolation. Nothing is uploaded."
    />

    <!--
      The card is a before and after of the sample frame with one of the
      bundled LUTs on it, rendered by scripts/render-og.mjs through the same
      lookup the page uses. A link to a colour tool that unfurls as a grey box
      says nothing about what the tool does.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="lutbox - preview .cube LUTs in the browser" />
    <meta
      property="og:description"
      content="Apply a .cube LUT to your own image at full resolution in the browser, with a real 3D texture and trilinear interpolation. Nothing is uploaded."
    />
    <meta property="og:url" content="https://keivanmalhani.github.io/lutbox/" />
    <meta property="og:image" content="https://keivanmalhani.github.io/lutbox/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The same frame twice, ungraded on the left and with the Blue Hour LUT applied on the right."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Cpath d='M6 22 L16 6 L26 22 Z' fill='none' stroke='%23d18e46' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif; color: #e7e7ea">
        lutbox does all of its work in the browser, so it needs JavaScript. There is no
        server-rendered version, because there is no server.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
